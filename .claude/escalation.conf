# escalation.conf — what needs a second look before it ships, and why.
#
# Read by .claude/hooks/escalate.sh, which is called from .claude/hooks/validate.sh (automatic)
# and can be run by hand:
#
#     .claude/hooks/escalate.sh grails-app/services/com/learning/bookstore/OrderService.groovy
#     .claude/hooks/escalate.sh --list                  # show the whole policy
#     .claude/hooks/escalate.sh --role DBA              # what counts as a schema decision
#     .claude/hooks/escalate.sh --unsure                # you are not sure. read this.
#
# THIS FILE IS THE POLICY. Edit it rather than editing the scripts. It is checked in, so a
# change to what-needs-review is a pull request with a diff, not a decision that lives in
# someone's head.
#
# ---------------------------------------------------------------------------------------------
# A NOTE ON ROLES. This repository has one maintainer. The roles below are not other people —
# they are the hats that person wears, and they are listed separately because the failure modes
# are different and the reflexes are different. "Escalate to DBA" here means: stop, put the
# schema hat on, and write the reasoning into the PR description where you will find it in six
# months. That is worth more on a solo project than it sounds, because there is no reviewer
# who will ask the question for you.
#
# ---------------------------------------------------------------------------------------------
# ROLE rows:  ROLE | key | contact | description
# RULE rows:  RULE | kind | pattern | role | level | reason
#   kind    path  — matched against the repo-relative file path, shell glob
#           text  — matched against the changed content, case-insensitive extended regex
#   NOTE: a pattern may NOT contain '|' — that is the field separator. Write alternatives as
#         separate RULE rows. Every matching rule is reported, so two rows behave as one 'or'.
#   level   STOP    — do not merge without deliberately signing this off. Say so in the PR.
#           ASK     — get a second opinion, or sleep on it. Usually ten minutes of thought.
#           TELL    — proceed, but record it: this changes something someone will trip over.
#   reason  one line, written for someone who has not seen this code before.
#
# Order matters only for readability; every matching rule is reported.
# ---------------------------------------------------------------------------------------------

# ---- who ------------------------------------------------------------------------------------
ROLE | SECURITY | the security hat | public repo, self-hosted runner, no application auth — the blast radius is the laptop
ROLE | DBA      | the schema hat   | there is no migration tooling, so every schema decision is manual and hard to undo
ROLE | PIPELINE | the release hat  | CI, deploy, rollback and the health gate — breaking these breaks the way changes ship
ROLE | OWNER    | the author hat   | the load-bearing internals: order state, stock locking, the version ceiling

# ---- the public repo meets the self-hosted runner ---------------------------------------------
RULE | text | runs-on:.*self-hosted                        | SECURITY | STOP | A workflow that runs repository code on the self-hosted runner executes it on the maintainer's laptop. Only deploy-local.yml may do this, and only from 'push: main'. See .claude/context/security.md.
RULE | path | .github/workflows/deploy-local.yml           | SECURITY | STOP | This is the only workflow allowed on the self-hosted runner. Adding a 'pull_request' trigger to it turns any fork PR into remote code execution on the laptop.
RULE | text | pull_request                                 | SECURITY | ASK  | A pull_request trigger runs untrusted code, including from forks. It must stay on GitHub-hosted runners.
RULE | text | uses:.*@v[0-9]                               | PIPELINE | STOP | The repository sets sha_pinning_required, so an action referenced by tag is rejected at run time. Pin the commit SHA and put the version in a trailing comment.
RULE | path | scripts/setup-self-hosted-runner.sh          | SECURITY | ASK  | This registers a runner that executes repository code on this machine, and installs it as a root-owned systemd service.

# ---- credentials -------------------------------------------------------------------------------
RULE | text | password[[:space:]]*[:=][[:space:]]*["']     | SECURITY | STOP | A literal credential appears in this change. This repository is public and has leaked one before. Passwords come from the environment or ~/.grails/bookstore-local.groovy.
RULE | text | secret[[:space:]]*[:=][[:space:]]*["']       | SECURITY | STOP | A literal secret appears in this change. Deployed values belong in GitHub environment secrets.
RULE | text | api[_-]?key[[:space:]]*[:=][[:space:]]*["']  | SECURITY | STOP | An API key appears in this change.
RULE | text | private[_-]?key                              | SECURITY | STOP | A private key appears in this change. It must never be committed.
RULE | path | .claude/settings*.json                       | SECURITY | ASK  | The permission allow/deny lists are a real boundary, not a convenience. deny beats allow; widening allow widens what runs unattended.

# ---- schema, and the absence of migrations -----------------------------------------------------
RULE | path | grails-app/domain/*                          | DBA | STOP | Production runs dbCreate 'none' with a DML-only account. A new or renamed field reaches the code but never the schema, and fails at runtime on the missing column — not at deploy. Apply the DDL by hand first.
RULE | path | grails-app/conf/DataSource.groovy            | DBA | STOP | Environment wiring for all three environments. Development owns its schema and production must never be on the other end of that; they shared one database until 2026-08-29.
RULE | text | dbcreate                                     | DBA | STOP | dbCreate decides whether Hibernate may rewrite the schema. Production is 'none' and must stay 'none'.
RULE | text | drop[[:space:]]+table                        | DBA | STOP | There is no backup discipline on this database and no migration ledger. A dropped table is gone.
RULE | text | truncate[[:space:]]+table                    | DBA | STOP | Same: no backups, no ledger.
RULE | text | alter[[:space:]]+table                       | DBA | ASK  | Schema changes are applied by hand and recorded nowhere. Write down what you ran and where, or the next environment diverges silently.

# ---- the load-bearing internals ------------------------------------------------------------------
RULE | path | *services/*/OrderService.groovy              | OWNER | ASK | Three things overlap here: the status machine, the pessimistic stock lock, and cancel-restores-stock. Changing one usually means the other two need re-reading.
RULE | path | *domain/*/OrderStatus.groovy                 | OWNER | ASK | canTransitionTo is the whole state machine. Its 11 legal transitions are covered by tests — if you widen it, widen the spec first.
RULE | text | \.lock\(                                     | OWNER | ASK | Book.lock(id) is a database-level pessimistic lock and the only thing preventing oversell. A write path that loads a book any other way silently bypasses it.
RULE | path | *controllers/*/HealthController.groovy       | PIPELINE | STOP | /health is the deploy gate. If it stops returning 200, or stops reporting the commit, every deploy fails its health check and rolls back.
RULE | path | grails-app/conf/UrlMappings.groovy           | SECURITY | ASK | There is no authentication anywhere in this application. Every route added here is public to anyone who can reach the port.

# ---- the version ceiling ---------------------------------------------------------------------------
RULE | path | grails-app/conf/BuildConfig.groovy           | OWNER | STOP | source and target level are pinned to 1.7 because Groovy 2.4 cannot emit higher. The MariaDB driver is pinned at 1.5.9 because 2.x speaks JDBC 4.2 and Hibernate 3.6 does not. Both look like stale versions and are not.
RULE | path | application.properties                       | OWNER | TELL | app.grails.version is read by the build; the deploy pipeline appends app.commit/app.build here at package time. A local build leaves this file dirty — do not commit the stamp.
RULE | text | java.util.stream                             | OWNER | ASK | Bytecode target is 1.7. Streams are a Java 8 API — available at runtime on the JDK 8 that builds this, but easy to pair with syntax that will not compile.

# ---- release mechanics --------------------------------------------------------------------------
RULE | path | scripts/deploy-local.sh                      | PIPELINE | ASK | This removes and recreates the running container on every deploy, and is the only rollback path. Breaking the health check or the release symlink leaves nothing serving.
RULE | path | .github/workflows/ci.yml                     | PIPELINE | ASK | CI is the required status check on main. If its job name changes, branch protection blocks every PR until the required check is renamed to match.
