grails:
  profile: web
  codegen:
    defaultPackage: com.learning.bookstore
  gorm:
    failOnError: true

environments:
  development:
    dataSource:
      dbCreate: update
      url: jdbc:mariadb://localhost:3306/bookstore_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      username: developer
      password: dev_password_123
  test:
    dataSource:
      dbCreate: create-drop
      url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
      driverClassName: org.h2.Driver
      username: sa
      password: ""
      dialect: org.hibernate.dialect.H2Dialect
  production:
    dataSource:
      # dbCreate must be 'none' in production; run migrations explicitly
      dbCreate: none
      url: ${DB_URL:jdbc:mariadb://localhost:3306/bookstore_db?useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_USER:developer}
      password: ${DB_PASSWORD}

# Shared dataSource defaults (overridden per-environment above)
dataSource:
  pooled: true
  jmxExport: true
  driverClassName: org.mariadb.jdbc.Driver
  dialect: org.hibernate.dialect.MariaDB103Dialect
  properties:
    jmxEnabled: true
    initialSize: 5
    maxActive: 50
